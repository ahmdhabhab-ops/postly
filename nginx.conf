# Keep the original scheme when Traefik (HTTPS) sits in front, so the API can set Secure cookies.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Backend API (Node/Express). Reachable only through this proxy; the api container is not published.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 130s;   # AI web search can take a minute or more
        proxy_send_timeout 130s;
        client_max_body_size 1m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
